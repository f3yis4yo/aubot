name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aubot
          POSTGRES_USER: aubot
          POSTGRES_PASSWORD: aubot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aubot" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://aubot:aubot@localhost:5432/aubot
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: example.com
      - run: python manage.py makemigrations --check --dry-run
      # Includes the TC01-TC04 benchmark thresholds from Assessment 2 as hard gates.
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build
