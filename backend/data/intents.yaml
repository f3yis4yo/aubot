  book_appointment:
    actions: [handoff]
    responses:
      - "I can help you book a visit. Tell me the job (for example a leaking tap or a faulty power point), your suburb and a preferred day, and our scheduling team will confirm a time. Standard bookings are usually available within 1–2 business days."
