# UC01 intent model: training phrases + response templates.
# Placeholders in {braces} are filled from the BusinessProfile (editable by the SME owner).
# The evaluation set in data/eval/tc01_intents.csv is held out: none of its queries appear here.
#
# actions: hints for the UI (e.g. show the upload button or the "talk to a human" button).

intents:
  opening_hours:
    responses:
      - "We're open {opening_hours}. Outside those hours I can still help you here, and urgent jobs can be logged for a call-back first thing."
    phrases:
      - what are your opening hours
      - when are you open
      - what time do you open
