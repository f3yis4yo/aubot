    responses:
      - "Our standard call-out fee is $99 (including the first 30 minutes on site), then $120 per hour in 15-minute blocks. Larger jobs get a free written quote after inspection. Parts are charged at the listed price, and there's no after-hours surcharge for jobs booked during business hours."
